[project]
name = "linkvault"
version = "0.1.0"
description = "Save links from any app; they sort themselves."
requires-python = ">=3.12"
dependencies = [
    "flet==1.0.4",
    "httpx>=0.27",
]

[tool.flet]
org = "com.linkvault"
product = "LinkVault"
company = "LinkVault"
copyright = "Copyright (C) 2026"

[tool.flet.app]
path = "."
module = "main"

# Share intents (Android) and Shortcuts (iOS) open linkvault://app/save?url=...
[tool.flet.deep_linking]
scheme = "linkvault"
host = "app"

[tool.flet.android.permission]
"android.permission.INTERNET" = true

[tool.flet.ios]
# Needed for TestFlight / App Store builds. Fill in your Apple team ID.
# team_id = "ABCDE12345"
