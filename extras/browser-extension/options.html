<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>LinkVault settings</title>
  <style>
    body { font: 14px system-ui, sans-serif; margin: 24px; max-width: 420px; }
    label { display: block; margin-top: 12px; font-weight: 600; }
    input { width: 100%; padding: 8px; box-sizing: border-box; }
    button { margin-top: 16px; padding: 8px 16px; }
    #status { margin-left: 8px; color: #2e7d32; }
  </style>
</head>
<body>
  <h2>LinkVault</h2>
  <label for="server">Server URL</label>
  <input id="server" placeholder="https://your-server.example.com">
  <label for="apiKey">API key</label>
  <input id="apiKey" placeholder="lv_…  (LinkVault app > Settings > API key)">
  <button id="save">Save</button><span id="status"></span>
  <script src="options.js"></script>
</body>
</html>
